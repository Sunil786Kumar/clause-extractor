name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"

      # uv installs the Python version from .python-version.
      - name: Install dependencies
        run: uv sync --frozen

      # No API key needed: the tests use a fake Anthropic client.
      - name: Run tests
        run: uv run --frozen pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t clause-extractor:ci .
